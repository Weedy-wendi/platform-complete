openapi: 3.1.0
info:
  title: Pingce Platform API
  version: 1.0.0
  description: |
    Pingce 平台的 REST 接入层契约。OpenAPI 是本层的唯一接口真相；
    前端类型必须由本文件生成，禁止手写镜像类型。
servers:
  - url: https://pingce.example.com
    description: Production
  - url: http://127.0.0.1:8000
    description: Local
security:
  - bearerAuth: []
tags:
  - name: health
  - name: projects
  - name: datasets
  - name: datasources
  - name: runs
  - name: evaluators
  - name: suites
  - name: targets
  - name: gates
  - name: reports
  - name: badcases
  - name: functional

paths:
  /healthz:
    get:
      tags: [health]
      security: []
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /readyz:
    get:
      tags: [health]
      security: []
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Dependency unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/projects:
    get:
      tags: [projects]
      summary: List projects
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [projects]
      summary: Create project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
                description: { type: string, maxLength: 1024 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/projects/{project_id}:
    get:
      tags: [projects]
      summary: Get project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/datasets:
    get:
      tags: [datasets]
      summary: Search datasets
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 200 }
        - name: project_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of datasets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Dataset" }
                  next_cursor: { type: string }
    post:
      tags: [datasets]
      summary: Create dataset
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id: { type: string }
                name: { type: string, maxLength: 128 }
                tags: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/datasets/{dataset_id}/versions:
    post:
      tags: [datasets]
      summary: Publish an immutable dataset version
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema, content_hash]
              properties:
                schema: { type: object }
                content_hash: { type: string }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetVersion" }
        "409":
          description: Version conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/datasets/{dataset_id}/versions/{version}/samples:
    get:
      tags: [datasets]
      summary: Page samples
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of samples
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Sample" }
                  next_cursor: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/datasources:
    get:
      tags: [datasources]
      summary: List datasources
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of datasources
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Datasource" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [datasources]
      summary: Create a datasource
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasourceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datasource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/datasources/{datasource_id}:
    get:
      tags: [datasources]
      summary: Get a datasource
      parameters:
        - $ref: "#/components/parameters/DatasourceId"
      responses:
        "200":
          description: Datasource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datasource" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [datasources]
      summary: Update a datasource
      parameters:
        - $ref: "#/components/parameters/DatasourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasourceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datasource" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [datasources]
      summary: Delete a datasource
      parameters:
        - $ref: "#/components/parameters/DatasourceId"
      responses:
        "204":
          description: Deleted
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/runs:
    post:
      tags: [runs]
      summary: Start a run (202 + run_id)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suite_id, dataset_id, dataset_version]
              properties:
                suite_id: { type: string }
                suite_version: { type: string }
                dataset_id: { type: string }
                dataset_version: { type: integer, minimum: 1 }
                target_config: { type: object }
                baseline_run_id: { type: string }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id: { type: string }
                  status: { type: string }
                  manifest_hash: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [runs]
      summary: List runs
      parameters:
        - name: suite_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  next_cursor: { type: string }

  /v1/runs/{run_id}:
    get:
      tags: [runs]
      summary: Get run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/runs/{run_id}/items:
    get:
      tags: [runs]
      summary: Page run items
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: status
          in: query
          schema: { type: string, enum: [succeeded, failed, skipped, error] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RunItem" }
                  next_cursor: { type: string }

  /v1/runs/{run_id}/cancel:
    post:
      tags: [runs]
      summary: Cancel a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Cancellation accepted
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/runs/{run_id}/compare:
    get:
      tags: [runs]
      summary: Compare against a baseline
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: baseline_run_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Metric deltas
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics:
                    type: array
                    items: { $ref: "#/components/schemas/MetricDelta" }
                  warnings:
                    type: array
                    items: { type: string }

  /v1/evaluators:
    get:
      tags: [evaluators]
      summary: List evaluators
      responses:
        "200":
          description: Published evaluators
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Evaluator" }
    post:
      tags: [evaluators]
      summary: Create a versioned evaluator config
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluatorCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluator" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/evaluators/{evaluator_id}:
    get:
      tags: [evaluators]
      summary: Get an evaluator config
      parameters:
        - $ref: "#/components/parameters/EvaluatorId"
      responses:
        "200":
          description: Evaluator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluator" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/suites:
    get:
      tags: [suites]
      summary: List suite configs
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of suites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigResource" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [suites]
      summary: Create a versioned suite config
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/suites/{suite_id}:
    get:
      tags: [suites]
      summary: Get a suite config
      parameters:
        - $ref: "#/components/parameters/SuiteId"
      responses:
        "200":
          description: Suite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigResource" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/targets:
    get:
      tags: [targets]
      summary: List target configs
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of targets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigResource" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [targets]
      summary: Create a versioned target config
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/targets/{target_id}:
    get:
      tags: [targets]
      summary: Get a target config
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "200":
          description: Target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigResource" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/gates/{suite_id}/{run_id}:
    get:
      tags: [gates]
      summary: Get gate result
      parameters:
        - name: suite_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Gate result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/reports/{run_id}:
    get:
      tags: [reports]
      summary: Get or export a run report
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: format
          in: query
          schema: { type: string, enum: [json, markdown, csv, junit], default: json }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { type: object }
            text/markdown:
              schema: { type: string }

  /v1/reports/{run_id}/share:
    post:
      tags: [reports]
      summary: Create a signed report share link
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLinkCreate" }
      responses:
        "200":
          description: Signed share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/share/{token}:
    get:
      tags: [reports]
      summary: Read a report through a signed share link
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Report content
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/badcases/search:
    post:
      tags: [badcases]
      summary: Search badcases (semantic with keyword fallback)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, maxLength: 200 }
                dataset_id: { type: string }
                tags: { type: array, items: { type: string }, maxItems: 10 }
                limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [items, degraded]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BadcaseHit" }
                  degraded: { type: boolean }

  /v1/functional/runs:
    get:
      tags: [functional]
      summary: List functional test runs
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of functional runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FunctionalRun" }
                  next_cursor: { type: string }
    post:
      tags: [functional]
      summary: Start a functional test run
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suite_id]
              properties:
                suite_id: { type: string }
                suite_version: { type: string }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id: { type: string }
  /v1/functional/runs/{run_id}:
    get:
      tags: [functional]
      summary: Get a functional test run with step results and evidence
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Functional run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionalRun" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API Key `pk_<env>_<key_id>_<secret>`

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 128 }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema: { type: string }
    DatasourceId:
      name: datasource_id
      in: path
      required: true
      schema: { type: string }
    EvaluatorId:
      name: evaluator_id
      in: path
      required: true
      schema: { type: string }
    SuiteId:
      name: suite_id
      in: path
      required: true
      schema: { type: string }
    TargetId:
      name: target_id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid or expired share token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient scope or role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (also used for cross-tenant access)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code: { type: string }
        message: { type: string }
        trace_id: { type: string }
        details: { type: object }
    Project:
      type: object
      required: [id, name, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        updated_at: { type: string, format: date-time }
    Dataset:
      type: object
      required: [id, project_id, name, latest_version, sample_count]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        latest_version: { type: integer }
        sample_count: { type: integer }
        tags: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
    DatasetVersion:
      type: object
      required: [dataset_id, version, content_hash, row_count]
      properties:
        dataset_id: { type: string }
        version: { type: integer }
        content_hash: { type: string }
        row_count: { type: integer }
        schema: { type: object }
    Datasource:
      type: object
      required: [id, name, kind, version, config]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string }
        version: { type: integer }
        config: { type: object }
        updated_at: { type: string, format: date-time }
    DatasourceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 1024 }
        kind: { type: string, maxLength: 64, default: generic }
        config: { type: object }
    DatasourceUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 1024 }
        kind: { type: string, maxLength: 64 }
        config: { type: object }
    ConfigResource:
      type: object
      required: [id, name, version, config]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: integer }
        config: { type: object }
    ConfigCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 1024 }
        config: { type: object }
    Sample:
      type: object
      required: [sample_id, payload]
      properties:
        sample_id: { type: string }
        payload: { type: object }
        tags: { type: array, items: { type: string } }
    Run:
      type: object
      required: [run_id, status, progress, manifest_hash]
      properties:
        run_id: { type: string }
        status:
          type: string
          enum: [queued, dispatching, running, succeeded, succeeded_with_errors, failed, cancelled, timed_out]
        progress: { type: number, minimum: 0, maximum: 1 }
        manifest_hash: { type: string }
        summary: { type: object }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    RunItem:
      type: object
      required: [item_id, sample_id, status]
      properties:
        item_id: { type: string }
        sample_id: { type: string }
        status: { type: string, enum: [succeeded, failed, skipped, error] }
        score: { type: number }
        latency_ms: { type: integer }
        error: { type: object }
        evidence_ref: { type: string }
    MetricDelta:
      type: object
      required: [name, baseline, candidate, delta]
      properties:
        name: { type: string }
        baseline: { type: number }
        candidate: { type: number }
        delta: { type: number }
        delta_pct: { type: number }
        significant: { type: boolean }
    Evaluator:
      type: object
      required: [id, name, version, kind]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        kind: { type: string, enum: [rule, judge, human] }
        metrics: { type: array, items: { type: object } }
        config: { type: object }
    EvaluatorCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 1024 }
        version: { type: string, maxLength: 64 }
        kind: { type: string, enum: [rule, judge, human], default: rule }
        project_id: { type: string }
        metrics: { type: array, items: { type: object } }
        config: { type: object }
    ShareLinkCreate:
      type: object
      properties:
        ttl_seconds: { type: integer, minimum: 1, maximum: 604800, default: 3600 }
    ShareLink:
      type: object
      required: [token, expires_at, url]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        url: { type: string }
    GateResult:
      type: object
      required: [passed, rules]
      properties:
        passed: { type: boolean }
        manifest_hash: { type: string }
        evaluated_at: { type: string, format: date-time }
        rules:
          type: array
          items:
            type: object
            required: [name, expected, actual, passed]
            properties:
              name: { type: string }
              expected: { type: string }
              actual: { type: string }
              passed: { type: boolean }
              evidence_ref: { type: string }
    FunctionalRun:
      type: object
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        steps:
          type: array
          items:
            type: object
            properties:
              step_id: { type: string }
              status: { type: string }
              evidence_ref: { type: string }
              visual_diff_ref: { type: string }
    BadcaseHit:
      type: object
      required: [badcase_id, title]
      properties:
        badcase_id: { type: string }
        title: { type: string }
        dataset_id: { type: string }
        sample_id: { type: string }
        tags: { type: array, items: { type: string } }
        similarity: { type: number }
        evidence_ref: { type: string }
