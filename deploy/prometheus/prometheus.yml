global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: pingce-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: pingce-mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-server:8765"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
