name: pingce

services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: pingce
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "3306:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-../.local/mysql-compose}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - ${REDIS_DATA_DIR:-../.local/redis-compose}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  init:
    image: pingce-backend:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.cli.init_db"]
    environment:
      PINGCE_ENV: dev
      PINGCE_MCP_DB_DSN: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-change-me-root}@mysql:3306/pingce?charset=utf8mb4
      MCP_RO_PASSWORD: ${MCP_RO_PASSWORD:-change-me-ro}
      MCP_AUDIT_PASSWORD: ${MCP_AUDIT_PASSWORD:-change-me-audit}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  mcp-server:
    image: pingce-backend:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PINGCE_ENV: dev
      PINGCE_MCP_AUTH_MODE: api_key
      PINGCE_MCP_API_KEY_PEPPER: ${MCP_API_KEY_PEPPER:-change-me-pepper}
      PINGCE_MCP_CURSOR_SECRET: ${MCP_CURSOR_SECRET:-change-me-cursor}
      PINGCE_MCP_DB_DSN: mysql+pymysql://pingce_mcp_ro:${MCP_RO_PASSWORD:-change-me-ro}@mysql:3306/pingce?charset=utf8mb4
      PINGCE_MCP_AUDIT_DSN: mysql+pymysql://pingce_mcp_audit:${MCP_AUDIT_PASSWORD:-change-me-audit}@mysql:3306/pingce?charset=utf8mb4
      PINGCE_MCP_REDIS_URL: redis://redis:6379/0
      PINGCE_MCP_CONTRACTS_PATH: /app/contracts/tools.yaml
      PINGCE_MCP_DNS_REBINDING_PROTECTION: "false"
    ports:
      - "8765:8765"
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 10
