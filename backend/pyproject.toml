[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pingce-backend"
version = "0.1.0"
description = "Pingce data + evaluation + MCP platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=1.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "alembic>=1.13",
  "redis>=5",
  "celery>=5.4",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2",
  "testcontainers>=4.8",
]
storage = ["boto3>=1.34"]

[project.scripts]
pingce = "app.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
